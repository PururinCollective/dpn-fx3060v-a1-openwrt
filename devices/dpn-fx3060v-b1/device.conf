# NijikaWrt device profile: D-Link DPN-FX3060V, hardware revision B1
# RTL9607DQ "Taurus" (Cortex-A55), like A1, plus a 2.5GbE port through an
# external Realtek RTL8221B PHY (stock module rtl8221b.ko, switch port 5-7).
# See NOTES.md next to this file for the facts behind each value.

DEVICE_ID=dpn-fx3060v-b1

# OpenWrt board name (board_name, sysupgrade metadata, image file names)
DEVICE_BOARD=dlink,dpn-fx3060v-b1
DEVICE_MODEL="D-Link DPN-FX3060V (B1)"
DEVICE_MODEL_SHORT="DPN-FX3060V (B1)"	# login banner: "ft. <model>"

# Stock firmware the image is built from (./stock/) and that the factory
# image installs next to, e.g. "DPN-FX3060V_V2.0.3 -- Fri Aug 2 14:21:24 CST 2024".
# Measured unit runs V2.0.2 (kernel Jan 14 2024); the V2.0.3 .bin is newer.
DEVICE_STOCK_MATCH='^DPN-FX3060V_V2\.'

# Hardware fingerprint: PHY ID (page 0, registers 2+3) of switch ports 0..6,
# as read with `diag rt_port get phy-reg port <n> page 0 register 2|3`.
# Measured on a B1 (telnet, V2.0.2): internal GbE PHYs (0x001CCAC4) on ports
# 0-3, the RTL8221B 2.5G PHY (0x001CC849) on ports 4 and 5, nothing on 6.
# This differs from A1 (ff on 4-6), so the installers tell the revisions apart.
DEVICE_PHY_IDS='001ccac4 001ccac4 001ccac4 001ccac4 001cc849 001cc849 ffffffff'

# Data bytes of the UBI volumes the images are written to (from `ubinfo -a`).
# B1 differs from A1: the rootfs volume is only 25 MiB (not 70), because the
# B1 flash also carries ubi_framework1/2 (8 MiB each) and ubi_apps (48 MiB)
# for the YueMe/apps stack, which NijikaWrt leaves untouched.
DEVICE_KERNEL_MAX=6348800	# ubi_k0 / ubi_k1 = 50 LEBs (0x60e000)
DEVICE_ROOTFS_MAX=26284032	# ubi_r0 / ubi_r1 = 207 LEBs (0x1911000); ~25.1 MiB
