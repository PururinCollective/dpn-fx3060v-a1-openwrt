# NijikaWrt device profile: D-Link DPN-FX3060V, hardware revision B1
# RTL9607DQ "Taurus" (Cortex-A55), like A1, plus a 2.5GbE port through an
# external Realtek RTL8221B PHY (stock modules rtl8221b.ko / extGphy.ko).
# `diag rt_port get phy-reg` returns the RTL8221B ID on switch ports 4-5; the
# stock driver maps it to the HSGMII data path on port 4. See NOTES.md next
# to this file for the raw measurements behind each value.

DEVICE_ID=dpn-fx3060v-b1

# OpenWrt board name (board_name, sysupgrade metadata, image file names)
DEVICE_BOARD=dlink,dpn-fx3060v-b1
DEVICE_MODEL="D-Link DPN-FX3060V (B1)"
DEVICE_MODEL_SHORT="DPN-FX3060V (B1)"	# login banner: "ft. <model>"

# Stock firmware the image is built from (./stock/) and that the factory
# image installs next to, e.g. "DPN-FX3060V_V2.0.3 -- Fri Aug 2 14:21:24 CST 2024".
# Measured unit ran V2.0.2 (kernel Jan 14 2024); the V2.0.3 .bin is newer.
DEVICE_STOCK_MATCH='^DPN-FX3060V_V2\.'

# Hardware fingerprint: PHY ID (page 0, registers 2+3) of switch ports 0..6,
# as read with `diag rt_port get phy-reg port <n> page 0 register 2|3`.
# Raw reads on a B1 (stock V2.0.2): internal GbE PHYs (0x001CCAC4) on ports
# 0-3, the RTL8221B 2.5G PHY (0x001CC849) on ports 4 AND 5, 0xFFFF on 6.
# The ID appearing on two switch-port indices is as measured; NOTES.md records
# the raw output and what the stock driver does with the PHY. This differs
# from A1 (0xFFFF on 4-6), so the installers tell the revisions apart.
DEVICE_PHY_IDS='001ccac4 001ccac4 001ccac4 001ccac4 001cc849 001cc849 ffffffff'

# Image size limits.
# KERNEL_MAX = pfl_kernel1_sz from the U-Boot environment (nv getenv): the
# number of bytes U-Boot reads from ubi_k<bank>. fwu.sh caps the kernel at it.
# Same value as A1 (0x600000); the ubi_k0 volume is a touch larger (50 LEBs)
# but only 0x600000 is read, so this is the binding limit.
DEVICE_KERNEL_MAX=6291456	# pfl_kernel1_sz = 0x600000
# ROOTFS_MAX is the build-time limit (scripts/assemble.sh) and must be the real
# ubi_r0/ubi_r1 volume size. On the B1 that is only ~25 MiB, not the 70 MiB of
# pfl_rootfs1_sz (0x4600000, the U-Boot region, like A1): the B1 UBI carves
# ~45 MiB into ubi_framework1/2 + ubi_apps for the YueMe/apps stack, so the
# rootfs volume is 207 LEBs. fwu.sh checks the rootfs against the live volume
# size (data_bytes), so install-time is covered regardless.
DEVICE_ROOTFS_MAX=26284032	# ubi_r0 / ubi_r1 volume = 207 LEBs (~25.1 MiB)
