# NijikaWrt device profile: D-Link DPN-FX3060V, hardware revision A1
# RTL9607DQ "Taurus" (Cortex-A55), 512 MiB RAM, 256 MiB SPI-NAND (UBI),
# GPON with a Semtech GN25L95 BOSA, 4x GbE (switch ports 0-3), AX WiFi, 2x FXS.
# See NOTES.md next to this file for the facts behind each value.

DEVICE_ID=dpn-fx3060v-a1

# OpenWrt board name (board_name, sysupgrade metadata, image file names)
DEVICE_BOARD=dlink,dpn-fx3060v-a1
DEVICE_MODEL="D-Link DPN-FX3060V (A1)"
DEVICE_MODEL_SHORT="DPN-FX3060V (A1)"	# login banner: "ft. <model>"

# Stock firmware the image is built from (./stock/) and that the factory
# image installs next to. Matched (grep -E) against the stock /etc/version,
# e.g. "DPN-FX3060V_V1.1.2 -- Wed Nov 8 10:50:56 CST 2023".
DEVICE_STOCK_MATCH='^DPN-FX3060V_V1\.'

# Hardware fingerprint: PHY ID (page 0, registers 2+3) of switch ports 0..6,
# as read with `diag rt_port get phy-reg port <n> page 0 register 2|3`.
# A1: internal GbE PHYs (0x001CCAC4) on ports 0-3, nothing on 4-6.
# Images carry the stock kernel + device tree of their revision, so the
# installers refuse hardware that does not match (forceable).
DEVICE_PHY_IDS='001ccac4 001ccac4 001ccac4 001ccac4 ffffffff ffffffff ffffffff'

# Data bytes of the UBI volumes the images are written to
# (pfl_*_sz in the U-Boot environment).
DEVICE_KERNEL_MAX=6291456	# ubi_k0 / ubi_k1 = 0x600000
DEVICE_ROOTFS_MAX=73400320	# ubi_r0 / ubi_r1 = 0x4600000
