# NijikaWrt build configuration (D-Link DPN-FX3060V)
# Values here can be overridden from the environment, e.g.
#   OPENWRT_VERSION=24.10.6 ./build.sh

# --- Upstream OpenWrt userland -------------------------------------------
# armsr/armv8 is the generic aarch64 target; its packages run on the
# RTL9607DQ (Cortex-A55). The kernel is NOT taken from OpenWrt: we keep the
# stock Realtek 5.10.70 kernel + modules from the original firmware.
: "${OPENWRT_VERSION:=25.12.5}"
: "${OPENWRT_TARGET:=armsr}"
: "${OPENWRT_SUBTARGET:=armv8}"
: "${OPENWRT_MIRROR:=https://downloads.openwrt.org}"

# --- Device ------------------------------------------------------------------
# Hardware revision to build for: a directory in devices/ holding device.conf
# (board name, stock firmware match, hardware fingerprint, partition sizes).
: "${DEVICE:=dpn-fx3060v-a1}"

# --- Stock firmware (source of kernel, dtb and the vendor userland) --------
# D-Link's firmware is not redistributable, so it is never committed. Drop the
# original .bin (a tar) into ./stock/ or point STOCK_FW at it.
: "${STOCK_FW:=}"

# --- Kernel modules for the stock kernel (scripts/build-kmod.sh) -------------
# The stock 5.10.70 kernel lacks WireGuard and the CAKE qdisc (fq_codel, HTB,
# TBF and PRIO are built in). They are built as modules (with the crypto
# libraries WireGuard selects) from the kernel tree of the Realtek Luna SDK,
# with the stock kernel's own config and gcc 10.2 like the stock kernel.
# KERNEL_SDK: the SDK's rtl819x directory (e.g. the SDK VM's disk mounted with
# `guestmount -a <disk> -i --ro /media/realtek`); needed once, the prepared
# tree is kept as dl/linux-5.10.70-rtk.tar.zst. Without either, images are
# built without the modules (no WireGuard, no CAKE).
: "${KERNEL_SDK:=/media/realtek/root/SDK/rtl819x}"
# A new feature module here (a driver, a tunnel: EoIP, IPIP, ...) is a major
# change: its pull request needs the UART log of a real device (AGENTS.md
# section 11).
: "${KMOD_CONFIG:=WIREGUARD NET_SCH_CAKE}"
: "${KMOD_TOOLCHAIN_URL:=https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--glibc--bleeding-edge-2020.08-1.tar.bz2}"
: "${KMOD_TOOLCHAIN_SHA256:=212f3c05f3b2263b0e2f902d055aecc2755eba10c0011927788a38faee8fc9aa}"

# --- Branding ---------------------------------------------------------------
: "${NIJIKA_DISTRO:=NijikaWrt}"
# Optional release codename, shown as "NijikaWrt r647 (<codename>)".
: "${NIJIKA_CODENAME:=}"
# Release number shown as "NijikaWrt r<NIJIKA_REVISION>"; defaults to the
# number of commits in this repository (or 0 outside git).
: "${NIJIKA_REVISION:=}"
: "${NIJIKA_TAGLINE:=O P E N  P O N  F O U N D A T I O N}"

# --- Native helpers ---------------------------------------------------------
# C compiler for the helpers that run in the stock chroot (rtk-apply). They
# must target the stock glibc 2.30; zig cc can, a distribution aarch64 gcc
# links against its own newer glibc. Default: zig from PyPI through uv
# (fetched into ~/.cache/uv on first use). Any `zig` binary works:
#   ZIG=/opt/zig/zig ./build.sh
: "${ZIG:=uvx --from ziglang==0.15.2 python -m ziglang}"

# --- Image limits -----------------------------------------------------------
# The rootfs size limit comes from the device profile (DEVICE_ROOTFS_MAX);
# ROOTFS_MAX_BYTES overrides it.
: "${ROOTFS_MAX_BYTES:=}"
: "${SQUASHFS_BLOCK:=262144}"

# --- OpenWrt package selection ----------------------------------------------
# Packages removed from the armsr default set. Every kmod-* is dropped
# automatically as well: they target OpenWrt's kernel, not the stock 5.10.70.
OPENWRT_PKGS_REMOVE="
	dnsmasq firewall4 nftables odhcpd-ipv6only odhcp6c ppp ppp-mod-pppoe
	procd-ujail procd-seccomp partx-utils mkf2fs e2fsprogs
"

# Packages added on top. LuCI pieces that depend on netifd/fw4 managing the
# hardware are left out on purpose: the stock vendor stack owns the network.
OPENWRT_PKGS_ADD="
	uhttpd uhttpd-mod-ubus uhttpd-mod-ucode rpcd rpcd-mod-file rpcd-mod-luci rpcd-mod-ucode
	rpcd-mod-iwinfo
	luci-base luci-mod-status luci-mod-system luci-theme-bootstrap
	luci-app-package-manager
	coreutils-stat coreutils-sleep
	htop
	https-dns-proxy
	curl
	wireguard-tools
	qrencode
	tc-tiny
"
