# Stock miniupnpd (1.3): "upnpctrl up" starts it as
# "/bin/miniupnpd -i <wan> -a <lan ip> -p 52869" (no -f, no -S), so it reads
# this default file. Stock has no such file: any LAN host could map any
# port, also to another host's address.

# A client may only add mappings to its own address.
secure_mode=yes

# UPnP IGD and NAT-PMP: only ports 1024-65535, external and internal.
allow 1024-65535 0.0.0.0/0 1024-65535
deny 0-65535 0.0.0.0/0 0-65535
